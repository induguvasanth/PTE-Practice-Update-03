<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#e6e8f0;--brand:#5b38d6;--brand2:#7b3fe4;--soft:#f1efff;--dark:#172033;--gold:#b7791f;--shadow:0 18px 50px rgba(30,41,59,.08)}

button,input,textarea{font:inherit}button{cursor:pointer}.appbar{height:76px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:900}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 12px 26px rgba(91,56,214,.22)}.btn{border:1px solid var(--line);background:#fff;color:#334155;border-radius:13px;padding:11px 16px;font-weight:800;font-size:13px;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 24px rgba(91,56,214,.22)}.danger{border:0;color:#fff;background:#df8d8d}.shell{max-width:1800px;margin:auto;padding:20px 28px 34px}.task-nav{background:rgba(255,255,255,.88);border:1px solid var(--line);box-shadow:var(--shadow);padding:8px;border-radius:22px;display:grid;grid-template-columns:repeat(8,minmax(130px,1fr));gap:6px;margin-bottom:18px}.tab{min-height:58px;border:0;background:transparent;border-radius:15px;color:#586579;font-size:12px;font-weight:850;padding:8px;line-height:1.25}.tab.active{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 22px rgba(91,56,214,.22)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.main-card,.side-card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow)}.main-card{padding:24px}.side{display:grid;gap:14px;align-content:start}.side-card{padding:18px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:900;color:#6d5bc5}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.title-row h1{font-size:30px;margin:5px 0 4px;letter-spacing:-.04em}.subtitle{margin:0;color:var(--muted);font-size:13px}.status{padding:9px 13px;border-radius:999px;background:#f4f5f8;color:#64748b;font-size:11px;font-weight:900}.status.live{background:#fff0f0;color:#c24141}.result-card{border:1px solid #ddd8ff;background:linear-gradient(135deg,#fbfaff,#f1eeff);border-radius:20px;padding:18px;margin:20px 0}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.result-score{font-size:36px;color:#4938b8;font-weight:950;letter-spacing:-.05em}.result-label{font-size:11px;color:var(--muted);font-weight:800}.metric{margin-top:12px}.metric-row{display:flex;justify-content:space-between;font-size:11px;font-weight:850}.bar{height:7px;background:#e7e9ef;border-radius:999px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0}.audio-panel{border:1px solid var(--line);background:#fbfcff;border-radius:20px;padding:14px;margin:18px 0}.audio-label{font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:8px}.audio-panel audio{width:100%}.notice{border:1px solid #f0d49b;background:#fffaf0;color:#7a5b1d;border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.55}.question-count{font-size:11px;font-weight:850;color:#64748b;margin-top:20px}.prompt{margin-top:14px;border:1px solid var(--line);border-radius:19px;background:#fcfcfe;padding:24px;font-size:18px;line-height:1.75;min-height:140px}.prompt.small{font-size:15px;min-height:auto}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;color:#334155;font-weight:700;font-size:14px}.choice.selected{border-color:#6f52e5;background:#f3f0ff;color:#4f35b8;box-shadow:inset 0 0 0 1px #6f52e5}.choice .letter{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#f1f3f8;margin-right:8px;font-size:11px}.answer-box{width:100%;min-height:190px;border:1px solid var(--line);border-radius:18px;padding:16px;outline:none;resize:vertical;font-size:15px;line-height:1.6;margin-top:14px}.answer-box:focus{border-color:#8a78ea;box-shadow:0 0 0 4px #eeeaff}.answer-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:8px 2px}.blanks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}.blank{min-width:120px;border:1px solid #cfc8f8;background:#f8f7ff;border-radius:10px;padding:9px 11px;color:#5543bd;font-weight:850}.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.word{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}.word.used{opacity:.45}.token-wrap{display:block;margin-top:15px;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:17px;line-height:2.65}.token{display:inline;border:0;background:transparent;border-radius:3px;padding:2px 1px;font-size:inherit;line-height:inherit;color:inherit;cursor:pointer;white-space:normal}.token.selected{background:#31cbbb;color:#102b2b}.token.correct{background:#31cbbb;color:#102b2b}.token.missed{background:#ffe4a3;color:#7c4a00;text-decoration:underline}.token.wrong{background:#ffd9dc;color:#a31929;text-decoration:line-through}.token:focus-visible{outline:2px solid #6d42e8;outline-offset:3px}.hiw-solution-words{margin-top:8px;line-height:2}.hiw-solution-item{display:inline-block;margin-right:8px}.hiw-replacement{color:#c17a13}.token-wrap{word-spacing:normal}.score-box{margin:14px 0;font-size:13px;line-height:1.65}.side-score{font-size:38px;font-weight:900;color:#4938b8}.side-score-note{color:#64748b}.hiw-legend{font-size:12px;color:#64748b;margin-top:12px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.solution-panel{margin-top:14px;border:1px solid #eadfbf;background:#fffaf0;border-radius:17px;padding:15px;line-height:1.65;font-size:13px}.hidden{display:none!important}.side-card h3{margin:0 0 8px;font-size:14px}.timer{font-size:42px;font-weight:950;color:#4f3cc4;letter-spacing:-.06em;margin:4px 0}.side-muted{font-size:12px;color:var(--muted);line-height:1.55}.tip{background:#fbfaff;border:1px solid #e8e2ff;border-radius:16px;padding:14px;font-size:12px;line-height:1.65}.live-transcript{background:#172033;color:#e7edf8;border-radius:17px;min-height:115px;padding:14px;font-size:13px;line-height:1.6}.empty{padding:55px 20px;text-align:center;color:var(--muted)}@media(max-width:1200px){.task-nav{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr 320px}}@media(max-width:850px){.shell{padding:14px}.appbar{padding:0 14px}.task-nav{grid-template-columns:repeat(2,1fr);border-radius:18px}.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,1fr)}.title-row h1{font-size:24px}.choice-grid{grid-template-columns:1fr}}@media(max-width:560px){.brand{font-size:15px}.task-nav{grid-template-columns:1fr}.tab{min-height:48px}.main-card{padding:16px}.side{grid-template-columns:1fr}.title-row{display:block}.status{display:inline-block;margin-top:10px}.choice-grid{grid-template-columns:1fr}.controls .btn{flex:1}.shell{padding:10px}.prompt{padding:17px;font-size:16px}}

/* Premium question jump */
.question-jump{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #e3e7ef;border-radius:14px;background:rgba(255,255,255,.72);box-shadow:0 8px 22px rgba(15,23,42,.04)}
.question-jump label{font-size:11px;font-weight:900;color:#64748b;white-space:nowrap}.question-jump input{width:82px;border:1px solid #d8deea;border-radius:10px;background:#fff;padding:8px 9px;font-weight:800;color:#334155;outline:none}.question-jump input:focus{border-color:#7c5ce6;box-shadow:0 0 0 3px rgba(124,92,230,.12)}.question-jump .go{border:0;border-radius:10px;padding:8px 11px;font-weight:900;color:#fff;background:linear-gradient(135deg,#5637d8,#7846ed)}
@media(max-width:640px){.question-jump{width:100%;justify-content:space-between}.question-jump input{flex:1}}

/* Update 36: Mobile/tablet navigation is in normal document flow, never sticky/fixed. */
@media (max-width:1024px) {
  .appbar, .task-nav {position:static !important;top:auto !important;bottom:auto !important;}
  .task-nav {display:flex !important;flex-wrap:nowrap !important;grid-template-columns:none !important;overflow-x:auto !important;overflow-y:hidden !important;-webkit-overflow-scrolling:touch;scrollbar-width:thin;max-width:100%;}
  .task-nav > .tab {flex:0 0 auto !important;min-width:max-content !important;white-space:nowrap !important;}
}

<body>
<header class="appbar"><div class="brand"><div class="mark">P</div><span>Listening Practice</span></div><button class="btn" onclick="location.href='index.html'">Dashboard</button></header>
<main class="shell">
<nav class="task-nav">
<button class="tab active" data-task="summarizeSpoken">📝 Summarize Spoken Text</button>
<button class="tab" data-task="listeningMCQMultiple">☑️ Multiple Choice<br>Multiple Answers</button>
<button class="tab" data-task="listeningBlanks">🧩 Fill in the Blanks</button>
<button class="tab" data-task="highlightSummary">📋 Highlight Correct Summary</button>
<button class="tab" data-task="listeningMCQSingle">🔘 Multiple Choice<br>Single Answer</button>
<button class="tab" data-task="missingWord">❓ Select Missing Word</button>
<button class="tab" data-task="incorrectWords">🔎 Highlight Incorrect Words</button>

</nav>
<div class="layout">
<section class="main-card">
<div class="title-row"><div><div id="eyebrow" class="eyebrow">Listening + Writing</div><h1 id="title">Summarize Spoken Text</h1><p id="subtitle" class="subtitle"></p></div><div id="status" class="status">● Ready</div></div>
<div id="questionCount" class="question-count"></div>
<div id="content"></div>
</section>
<aside class="side">
<div class="side-card"><h3>Practice result</h3><p class="side-muted">Feedback appears after you finish the task.</p><div class="score-box" id="sideScoreBox" aria-live="polite"></div><button id="scoreSide" class="btn primary" style="width:100%">Score Task</button></div>
<div class="side-card"><h3>Exam controls</h3><div id="timer" class="timer">00:00</div><div id="timerState" class="side-muted">Ready</div><div class="controls"><button id="startBtn" class="btn primary">Start</button><button id="finishBtn" class="btn">Finish & Score</button></div></div>
<div class="side-card"><h3>Tips & tricks</h3><div id="tip" class="tip"></div></div>
<div class="side-card"><h3>Practice helper</h3><div id="helper" class="side-muted"></div></div>
<div class="side-card"><h3>Live workspace</h3><div id="workspace" class="live-transcript">Your notes and typed response will stay here during this question.</div></div>
</aside>
</div>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbytEPdMZdkgsnQVfKcb5HUoDWKnTGPNQb5LA-osdkAGF2ygPGZiYPxpzrdzEmPvb-9Bkw/exec';
const META={
summarizeSpoken:{label:'Summarize Spoken Text',skills:'Listening + Writing',meta:'Listen to a short recording and write a concise summary.',tip:'Write the main idea first, then include the most important supporting points. Keep the summary focused.',helper:'Practice mode can reveal the transcript after you attempt the task.',writing:true},
listeningMCQMultiple:{label:'Multiple Choice, Multiple Answers',skills:'Listening',meta:'Select all answers supported by the recording.',tip:'Do not select an option just because it sounds familiar. Choose only details you heard.',helper:'Listen once for the main idea and again for supporting details.'},
listeningBlanks:{label:'Fill in the Blanks',skills:'Listening + Writing',meta:'Complete the visible transcript while listening.',tip:'Focus on exact words, word forms and spelling. Read the surrounding words before selecting.',helper:'The transcript is shown with blanks because this is part of the task format.',blanks:true},
highlightSummary:{label:'Highlight Correct Summary',skills:'Listening',meta:'Choose the summary that best matches the recording.',tip:'Compare main idea, key details and speaker attitude. Ignore summaries with one important incorrect detail.',helper:'Do not look for identical words; look for the same meaning.'},
listeningMCQSingle:{label:'Multiple Choice, Single Answer',skills:'Listening',meta:'Choose one correct answer after listening.',tip:'Identify what the question is really asking before choosing an option.',helper:'One answer is correct. Avoid overthinking minor details.'},
missingWord:{label:'Select Missing Word',skills:'Listening',meta:'Choose the word or phrase that completes the recording.',tip:'Use grammar, meaning and the final context to predict the missing ending.',helper:'Pause before selecting and read all options once.',optionsOnly:true},
incorrectWords:{label:'Highlight Incorrect Words',skills:'Listening + Reading',meta:'Find words in the displayed text that do not match the recording.',tip:'Follow the text carefully while listening. Select only words that are different from the audio.',helper:'Practice mode checks selected words against the answer key.',incorrect:true},
dictation:{label:'Write from Dictation',skills:'Listening + Writing',meta:'Listen to a sentence and type it as accurately as possible.',tip:'Capture the sentence in chunks. Check spelling, grammar and word order before finishing.',helper:'The reference sentence is hidden during normal practice.',writing:true}
};
let DATA={},task='summarizeSpoken',idx=0,selected=[],answers=[],elapsed=0,timerInt=null,started=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function jsonp(action){return new Promise((resolve,reject)=>{const cb='pte_'+Date.now()+'_'+Math.floor(Math.random()*9999);const s=document.createElement('script');const tm=setTimeout(()=>{cleanup();reject(new Error('Backend timeout'))},15000);function cleanup(){clearTimeout(tm);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.src=API_URL+'?action='+encodeURIComponent(action)+'&callback='+cb+'&t='+Date.now();document.body.appendChild(s)})}
function formatTime(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function startTimer(){if(started)return;clearInterval(timerInt);started=true;setPracticeStatus('inprogress');timerInt=setInterval(()=>{$('timer').textContent=formatTime(++elapsed)},1000)}
function setPracticeStatus(state,finishedAt){
 const badge=$('status'),label=$('timerState');
 badge.classList.toggle('live',state==='inprogress');
 if(state==='finished'){
  let date=finishedAt?new Date(finishedAt):new Date();
  let valid=!Number.isNaN(date.getTime());
  let stamp=valid?new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).format(date):'';
  badge.textContent='✓ Finished'+(stamp?' · '+stamp:'');label.textContent='Finished';
 }else if(state==='inprogress'){badge.textContent='● In progress';label.textContent='In progress';}
 else{badge.textContent='● Ready';label.textContent='Ready';}
}
function stopTimer(finished=false){
 clearInterval(timerInt);timerInt=null;started=false;
 if(finished){
  const now=new Date().toISOString();
  setPracticeStatus('finished',now);
  try{localStorage.setItem('pte-listening-finished:'+task+':'+(current()?.id||idx),now)}catch(e){}
 }else setPracticeStatus('ready');
}
function current(){return (DATA[task]?.questions||[])[idx]||null}
function questionText(q){return q.text||q.question||q.prompt||''}
function splitOptions(q){return (Array.isArray(q.options)?q.options:[]).filter(Boolean).map((v,i)=>String(v).trim().replace(new RegExp('^\\s*'+String.fromCharCode(65+i)+'[.)]\\s*','i'),'').trim())}
function normalize(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function expectedOptions(q){let a=String(q.answer||'').trim();if(!a)return[];let opts=splitOptions(q);return a.split(/[|,;]+/).map(x=>x.trim()).filter(Boolean).map(x=>{let n=Number(x);if(/^[A-Fa-f]$/.test(x)){n=x.toUpperCase().charCodeAt(0)-65;return opts[n]||x}if(Number.isInteger(n)&&String(n)===x)return opts[n]||x;return x})}
function hiwWords(q){return String(q.transcript||questionText(q)||'').trim().split(/\s+/).filter(Boolean)}
function hiwAnswerParts(q){return String(q.answer||'').split('|').map(x=>x.trim()).filter(Boolean)}
function expectedIncorrectIndices(q){
 const words=hiwWords(q), keys=hiwAnswerParts(q), used=new Set(), found=[];
 for(const raw of keys){
  const key=raw.split('=')[0].trim();let pos=-1;
  if(/^#\d+$/.test(key)){pos=Number(key.slice(1))-1;}
  else if(/^@\d+$/.test(key)){pos=Number(key.slice(1))-1;}
  else {pos=words.findIndex((w,i)=>!used.has(i)&&normalize(w)===normalize(key));}
  if(pos>=0&&pos<words.length&&!used.has(pos)){used.add(pos);found.push(pos)}
 }
 return found.sort((a,b)=>a-b)
}
function hiwReplacements(q){
 const options=Array.isArray(q.options)?q.options.join('|'):String(q.options||'');
 const pairs=[...hiwAnswerParts(q),...options.split('|').map(x=>x.trim())];const out=new Map();
 for(const pair of pairs){const sep=pair.indexOf('=');if(sep<0)continue;const left=normalize(pair.slice(0,sep)),right=pair.slice(sep+1).trim();if(left&&right)out.set(left,right)}return out
}

function scoreQuestion(){const q=current();if(!q)return;let score=0,note='';const m=META[task];let response='';let hiwExpected=[];
if(m.writing){response=$('answerInput')?.value||'';const exp=task==='dictation'?(q.transcript||q.answer||''):(q.answer||q.transcript||'');const rWords=normalize(response).split(' ').filter(Boolean);const eWords=normalize(exp).split(' ').filter(Boolean);const counts=new Map();rWords.forEach(w=>counts.set(w,(counts.get(w)||0)+1));const hit=eWords.reduce((n,w)=>{const c=counts.get(w)||0;if(c){counts.set(w,c-1);return n+1}return n},0);score=eWords.length?Math.round(hit/eWords.length*100):0;note=task==='dictation'?'Practice estimate compares your typed response with the reference.': 'Practice estimate checks key words and completion.'}
else if(m.incorrect){const exp=hiwExpected=expectedIncorrectIndices(q);if(!exp.length){$('sideScoreBox').textContent='Cannot score: add incorrect words in the Answer column.';return;}const got=selected;const hit=got.filter(i=>exp.includes(i)).length;const wrong=got.filter(i=>!exp.includes(i)).length;score=exp.length?Math.max(0,Math.round((hit-wrong)/exp.length*100)):0;response=got.join(' | ');note='Practice score is based on correctly highlighted words.'}
else if(m.blanks){const exp=String(q.answer||'').split('|').map(x=>normalize(x));const got=answers.map(normalize);const hit=exp.reduce((n,x,i)=>n+(got[i]===x?1:0),0);score=exp.length?Math.round(hit/exp.length*100):0;response=answers.join(' | ');note='Practice score checks each blank against the answer key.'}
else {const exp=expectedOptions(q).map(normalize);const got=selected.map(i=>normalize(splitOptions(q)[i]));if(task==='listeningMCQMultiple'){score=window.PTEMultiChoice.grade(q,selected.map(i=>splitOptions(q)[i])).percent}else score=exp.length&&got.length&&exp.includes(got[0])?100:0;response=got.join(' | ');note='Practice score checks your selected answer(s) against the answer key.'}
$('sideScoreBox').innerHTML='<div class="side-score">'+score+'%</div><div class="side-score-note">'+esc(note)+'</div>';if(m.incorrect){document.querySelectorAll('[data-token]').forEach(b=>{const n=Number(b.dataset.token);b.classList.remove('selected');b.classList.add(hiwExpected.includes(n)?(selected.includes(n)?'correct':'missed'):(selected.includes(n)?'wrong':'neutral'));b.disabled=true;});$('sideScoreBox').innerHTML+='<div class="hiw-legend">Green: correct selection · Yellow: missed answer · Red: incorrect selection</div>';const panel=$('solutionPanel');if(panel){panel.classList.remove('hidden');const replacements=hiwReplacements(q);panel.innerHTML='<b>Solution comparison:</b><div class="hiw-solution-words">'+hiwExpected.map(i=>{const word=hiwWords(q)[i],replacement=replacements.get(normalize(word));return '<span class="hiw-solution-item">'+esc(word)+(replacement?' <span class="hiw-replacement">(Answer: '+esc(replacement)+')</span>':'')+'</span>'}).join(' · ')+'</div>'; }}stopTimer(true);saveResult(q,response,score);if(response.trim()||selected.length||answers.some(Boolean))window.PTEProgress?.markScore(score);window.scrollTo({top:0,behavior:'smooth'})}
function saveResult(q,response,score){const u=window.PTEAuth?.session();if(!u)return;
window.PTEAuth.request('write',{action:'saveResult',studentToken:u.studentToken,studentId:u.studentId,studentName:u.studentName,task:task,questionId:q.id||'',expectedText:q.answer||'',response:response||'',pteScore:score,accuracy:score,duration:elapsed,words:(response||'').trim().split(/\s+/).filter(Boolean).length}).catch(e=>console.warn('Result save:',e.message))}

function render(){const q=current(),arr=DATA[task]?.questions||[],m=META[task];window.PTEProgress?.setContext('Listening',task,idx,q,arr);$('eyebrow').textContent=m.skills;$('title').textContent=m.label;$('subtitle').textContent=m.meta;$('tip').textContent=m.tip;$('helper').textContent=m.helper;$('questionCount').textContent='QUESTION '+(arr.length?idx+1:0)+' OF '+arr.length;$('sideScoreBox').innerHTML='Not scored yet.';selected=[];answers=[];elapsed=0;$('timer').textContent='00:00';stopTimer(false);
if(!q){$('content').innerHTML='<div class="empty"><h2>No questions found</h2><p>Add the task sheet and practice rows, then refresh.</p></div>';return}
let h='';
if(q.audioUrl)h+='<div class="audio-panel"><div class="audio-label">Question audio</div><audio id="audio" controls playsinline webkit-playsinline preload="auto" src="'+esc(q.audioUrl)+'"></audio></div>';
else h+='<div class="notice">No Audio URL was found for this practice item. Add a direct public audio URL in the sheet to practise this task in audio-first mode.</div>';
if(m.blanks){let text=questionText(q)||q.transcript||'';h+='<div class="prompt small">'+renderBlanks(text)+'</div>'+renderWordBank(q)}
else if(m.incorrect){let text=q.transcript||questionText(q);h+='<div class="notice">Listen and select the incorrect words in the paragraph. Submit to compare with the correct answers.</div><div class="token-wrap">'+text.trim().split(/\s+/).map((w,i)=>'<button type="button" class="token" id="token-'+i+'" data-token="'+i+'" aria-pressed="false">'+esc(w)+'</button>').join(' ')+'</div>'}
else if(m.writing){h+='<div class="notice">The reference text is hidden during normal practice. Listen first and type your response from memory.</div><textarea id="answerInput" class="answer-box" placeholder="'+(task==='dictation'?'Type the sentence you hear…':'Write your summary here…')+'"></textarea><div class="answer-meta"><span id="wordCount">0 words</span><button id="showTranscript" class="btn">Show Transcript for Practice</button></div><div id="transcriptPanel" class="solution-panel hidden">'+esc(q.transcript||'No transcript provided.')+'</div>'}
else {let opts=splitOptions(q);if(opts.length)h+='<div class="choice-grid">'+opts.map((o,i)=>'<button class="choice" data-choice="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</button>').join('')+'</div>';else h+='<div class="notice">Add answer options to the sheet for this question.</div>'}
h+='<div class="controls"><button id="prevBtn" class="btn">← Previous</button><div class="question-jump"><label for="questionJump">Question</label><input id="questionJump" type="number" min="1" max="'+arr.length+'" value="'+(idx+1)+'" inputmode="numeric" aria-label="Enter question number"><button id="goQuestion" class="go">Go</button></div><button id="nextBtn" class="btn">Next →</button><button id="resetBtn" class="btn">Reset</button><button id="showSolution" class="btn">💡 Show Solution</button>'+(q.templateImageUrl?'<button id="showImage" class="btn">🖼️ Show Template Image</button>':'')+'</div>';
h+='<div id="solutionPanel" class="solution-panel hidden"><b>Solution</b><br>'+esc(q.answer||'No answer provided.')+'</div>'+(q.templateImageUrl?'<div id="imagePanel" class="solution-panel hidden"><img src="'+esc(q.templateImageUrl)+'" style="width:100%;max-height:420px;object-fit:contain;border-radius:12px"></div>':'');
$('content').innerHTML=h;bind(q);setupMobileAudio()}
// Mobile-friendly playback: keep a normal HTMLMediaElement for Android/iOS and Meet screen sharing.
// Web pages cannot grant Meet microphone permission or force Meet to capture internal audio.
let activeAudio=null;
function setupMobileAudio(){
 const audio=$('audio'); if(!audio)return;
 if(activeAudio&&activeAudio!==audio){activeAudio.pause();activeAudio.removeAttribute('src');activeAudio.load()}
 activeAudio=audio;
 audio.setAttribute('playsinline','');audio.setAttribute('webkit-playsinline','');
 audio.preload='auto';
 audio.addEventListener('error',()=>{
   const panel=audio.closest('.audio-panel');
   if(panel&&!panel.querySelector('.audio-error')){
     const msg=document.createElement('p');msg.className='audio-error';msg.style.cssText='color:#b42318;font-size:12px;margin:8px 0';
     msg.textContent='Audio could not load on this device. Check the audio URL, network connection and browser media support.';panel.appendChild(msg)
   }
 });
 audio.addEventListener('play',()=>{if(navigator.mediaSession){try{navigator.mediaSession.metadata=new MediaMetadata({title:'PTE Listening Practice',artist:'PTE Practice'});navigator.mediaSession.playbackState='playing'}catch(e){}}});
 audio.addEventListener('pause',()=>{if(navigator.mediaSession)try{navigator.mediaSession.playbackState='paused'}catch(e){}});
 if(navigator.mediaSession){try{
   navigator.mediaSession.setActionHandler('play',()=>audio.play().catch(()=>{}));
   navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
 }catch(e){}}
}
function renderBlanks(text){let n=0;return esc(text).replace(/_{3,}|(\[[^\]]+\])/g,()=>'<button class="blank" data-blank="'+(n++)+'">Blank '+n+'</button>')}
function renderWordBank(q){let opts=splitOptions(q);return opts.length?'<div class="word-bank">'+opts.map((w,i)=>'<button class="word" data-word="'+i+'">'+esc(w)+'</button>').join('')+'</div>':''}
function bind(q){$('prevBtn').onclick=()=>{if(idx>0){idx--;render()}};$('nextBtn').onclick=()=>{const a=DATA[task]?.questions||[];if(idx<a.length-1){idx++;render()}};$('goQuestion').onclick=()=>{const a=DATA[task]?.questions||[],entered=Math.trunc(Number($('questionJump').value)),n=entered-1;if(Number.isFinite(n)&&n>=0&&n<a.length){idx=n;render();window.scrollTo({top:0,behavior:'smooth'});}else{alert('Enter a question number from 1 to '+a.length);$('questionJump').focus();}};$('questionJump').onkeydown=e=>{if(e.key==='Enter')$('goQuestion').click();};$('resetBtn').onclick=()=>{try{localStorage.removeItem('pte-listening-finished:'+task+':'+(current()?.id||idx))}catch(e){}render()};$('showSolution').onclick=()=>{const panel=$('solutionPanel');panel.classList.toggle('hidden');const visible=!panel.classList.contains('hidden');if(META[task].incorrect){const exp=expectedIncorrectIndices(q), replacements=hiwReplacements(q);panel.innerHTML='<b>Correct incorrect words:</b><div class="hiw-solution-words">'+exp.map(i=>{const word=hiwWords(q)[i],replacement=replacements.get(normalize(word));return '<span class="hiw-solution-item">'+esc(word)+(replacement?' <span class="hiw-replacement">(Answer: '+esc(replacement)+')</span>':'')+'</span>'}).join(' · ')+'</div>';document.querySelectorAll('[data-token]').forEach(b=>{const n=Number(b.dataset.token);b.classList.toggle('missed',visible&&exp.includes(n)&&!selected.includes(n));b.classList.toggle('correct',visible&&exp.includes(n)&&selected.includes(n));b.classList.toggle('wrong',visible&&!exp.includes(n)&&selected.includes(n));});} $('showSolution').textContent=visible?'🙈 Hide Solution':'💡 Show Solution'};if($('showImage'))$('showImage').onclick=()=>{$('imagePanel').classList.toggle('hidden');$('showImage').textContent=$('imagePanel').classList.contains('hidden')?'🖼️ Show Template Image':'🙈 Hide Template Image'};
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let n=Number(b.dataset.choice);if(task==='listeningMCQMultiple'){selected=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n]}else selected=[n];document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',selected.includes(Number(x.dataset.choice))))});
document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{let n=Number(b.dataset.token);selected=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n];b.classList.toggle('selected',selected.includes(n))});
let activeBlank=null;document.querySelectorAll('[data-blank]').forEach(b=>b.onclick=()=>{activeBlank=Number(b.dataset.blank);document.querySelectorAll('[data-blank]').forEach(x=>x.style.outline='');b.style.outline='3px solid #d8d0ff'});
document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(activeBlank===null)return;answers[activeBlank]=b.textContent.trim();let bl=document.querySelector('[data-blank="'+activeBlank+'"]');if(bl)bl.textContent=b.textContent.trim();activeBlank=null;document.querySelectorAll('[data-blank]').forEach(x=>x.style.outline='')});
if($('answerInput')){$('answerInput').addEventListener('input',()=>{let t=$('answerInput').value;$('wordCount').textContent=t.trim()?t.trim().split(/\s+/).length+' words':'0 words';$('workspace').textContent=t||'Your notes and typed response will stay here during this question.'})}
if($('showTranscript'))$('showTranscript').onclick=()=>{$('transcriptPanel').classList.toggle('hidden');$('showTranscript').textContent=$('transcriptPanel').classList.contains('hidden')?'Show Transcript for Practice':'Hide Transcript'};}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{task=b.dataset.task;idx=0;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
$('startBtn').onclick=startTimer;$('finishBtn').onclick=scoreQuestion;$('scoreSide').onclick=scoreQuestion;
async function init(){try{const d=await jsonp('listening');DATA=d.section||{};render()}catch(e){$('content').innerHTML='<div class="empty"><h2>Backend connection failed</h2><p>'+esc(e.message)+'</p></div>'}}
init();
